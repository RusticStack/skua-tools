[package]
name = "skua-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "file, dos2unix, unix2dos and clear for Skua Bash (Git Bash-compatible output)"
repository = "https://github.com/RusticStack/skua-tools"
publish = false

[[bin]]
name = "file"
path = "src/bin/file.rs"

[[bin]]
name = "dos2unix"
path = "src/bin/dos2unix.rs"

[[bin]]
name = "clear"
path = "src/bin/clear.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "pgrep"
path = "src/bin/pgrep.rs"

[[bin]]
name = "pkill"
path = "src/bin/pkill.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]

[dependencies]
regex-lite = "0.1.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
