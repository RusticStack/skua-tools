[package]
name = "skua-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "file, dos2unix, unix2dos and clear for Skua Bash (Git Bash-compatible output)"
repository = "https://github.com/RusticStack/skua-tools"
publish = false

[[bin]]
name = "file"
path = "src/bin/file.rs"

[[bin]]
name = "dos2unix"
path = "src/bin/dos2unix.rs"

[[bin]]
name = "clear"
path = "src/bin/clear.rs"

[[bin]]
name = "xxd"
path = "src/bin/xxd.rs"

[[bin]]
name = "column"
path = "src/bin/column.rs"

[[bin]]
name = "iconv"
path = "src/bin/iconv.rs"

[dependencies]
encoding_rs = "0.8.35"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
