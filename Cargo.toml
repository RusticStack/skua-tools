[package]
name = "skua-tools"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Git Bash-compatible tools for Skua Bash: file, dos2unix, unix2dos, clear, ps, pgrep, pkill, gzip, gunzip, zcat, unzip, zip, xxd, column, iconv, start, egrep, fgrep, perl"
repository = "https://github.com/RusticStack/skua-tools"
publish = false
[[bin]]
name = "file"
path = "src/bin/file.rs"

[[bin]]
name = "dos2unix"
path = "src/bin/dos2unix.rs"

[[bin]]
name = "clear"
path = "src/bin/clear.rs"

[[bin]]
name = "ps"
path = "src/bin/ps.rs"

[[bin]]
name = "pgrep"
path = "src/bin/pgrep.rs"

[[bin]]
name = "pkill"
path = "src/bin/pkill.rs"

[[bin]]
name = "gzip"
path = "src/bin/gzip.rs"

[[bin]]
name = "unzip"
path = "src/bin/unzip.rs"

[[bin]]
name = "zip"
path = "src/bin/zip.rs"

[[bin]]
name = "xxd"
path = "src/bin/xxd.rs"

[[bin]]
name = "column"
path = "src/bin/column.rs"

[[bin]]
name = "iconv"
path = "src/bin/iconv.rs"

[[bin]]
name = "start"
path = "src/bin/start.rs"

[[bin]]
name = "egrep"
path = "src/bin/egrep.rs"

[[bin]]
name = "fgrep"
path = "src/bin/fgrep.rs"

[[bin]]
name = "perl"
path = "src/bin/perl.rs"

[dependencies]
encoding_rs = "0.8.35"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
regex-lite = "0.1.9"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
